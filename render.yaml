services:
  # Driver web app — static site (PWA)
  - type: web
    name: trips-driver
    env: static
    rootDir: web
    buildCommand: npm install && npm run build:driver
    staticPublishPath: dist-driver
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
